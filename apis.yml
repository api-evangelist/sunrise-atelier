aid: sunrise-atelier
name: Sunrise Atelier
description: >-
  Sunrise Atelier operates Sunrise.am, a free consumer service that provides
  accurate sunrise, sunset, twilight, golden-hour and daylight times for every
  city and country worldwide, plus a solar calendar, an online clock, and
  educational articles. For developers, Sunrise.am publishes a free public
  World Time API (documented at https://sunrise.am/developer and served from the
  time.now host) that returns the current time, timezone information,
  daylight-saving data, and IP-based time geolocation as clean JSON with no API
  key required and CORS enabled. Surfaced as a portfolio company of 500 Global
  and enriched in the API Evangelist network from its live developer surface.
